<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data:" />
    <title>Karte gesteckt</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="karte-body">
    <header class="kopf">
      <svg class="kopf-signet" viewBox="0 0 331.11 331.11" role="img" aria-label="Lars Zumpe Medienproduktion">
        <path fill="currentColor" d="M48.53 235.49L75.69 95.62L110.61 95.62L83.45 235.49ZM208.68 235.49L126.23 235.49L131.46 208.33L181.32 161.77L140.58 161.77L145.82 134.61L228.27 134.61L223.03 161.77L173.17 208.33L213.92 208.33Z"/>
        <path fill="#D6402E" d="M247.41 235.49L251.94 205.91L282.58 205.91L278.05 235.49Z"/>
      </svg>
      <div class="kopf-titel">
        <h1 id="titel">Karte gesteckt</h1>
        <p id="untertitel">Wird eingelesen …</p>
      </div>
      <div class="themen" role="group" aria-label="Darstellung">
        <button type="button" data-thema="auto" title="Wie das System" aria-label="Wie das System" aria-pressed="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
        </button>
        <button type="button" data-thema="hell" title="Hell" aria-label="Hell" aria-pressed="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
        <button type="button" data-thema="dunkel" title="Dunkel" aria-label="Dunkel" aria-pressed="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
      </div>
    </header>

    <main>
      <p class="satz" id="satz" role="status" aria-live="polite">Dateien werden gezählt …</p>
      <p class="hinweis" id="fortschritt"></p>

      <section class="karte">
        <h2>Ziele</h2>
        <ul class="zielliste" id="zielliste"></ul>
        <p class="hinweis" id="zielHinweis"></p>
        <button type="button" class="knopf knopf-still knopf-klein" id="btnZieleEinrichten">Ziele einrichten …</button>
      </section>

      <section class="karte">
        <label class="feld">
          <span>Ordner auf den Zielen (frei lassen für den Datumsbaum)</span>
          <input type="text" id="unterordner" placeholder="z. B. Hochzeit Müller" />
        </label>
        <label class="schalter"><input type="checkbox" id="umbenennen" /> Nach Aufnahmezeit umbenennen</label>
      </section>

      <div class="zeile zeile-umbruch karte-knoepfe">
        <button type="button" class="knopf knopf-primaer" id="btnSichern" disabled>Auf alle Ziele sichern</button>
        <button type="button" class="knopf knopf-still" id="btnPruefen">Erneut prüfen</button>
        <button type="button" class="knopf knopf-still" id="btnImport">Importfenster …</button>
        <button type="button" class="knopf knopf-still" id="btnSpaeter">Später</button>
      </div>
      <label class="schalter"><input type="checkbox" id="nieWieder" /> Diesen Datenträger nicht mehr melden</label>
      <p class="hinweis">Das Kopieren läuft im Hintergrund weiter — dieses Fenster darf zu. Der Stand steht in der Menüleiste.</p>
    </main>

    <script src="thema.js"></script>
    <script src="karte.js"></script>
  </body>
</html>
